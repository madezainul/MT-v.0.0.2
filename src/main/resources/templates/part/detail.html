<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/dashboard}">
<head>
    <title>Part Detail</title>
    <style>
        .part-image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            min-height: 250px;
        }
        .part-image-container img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .part-image-container img:hover {
            transform: scale(1.05);
        }
        .part-info-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .part-info-section h6 {
            color: #2196F3;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        .info-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .info-item {
            display: flex;
            flex-direction: column;
        }
        .info-item label {
            color: #6c757d;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .info-item .value {
            font-size: 0.95rem;
            font-weight: 500;
            color: #212529;
        }
        .btn-action-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }
        .card-header {
            border-bottom: 2px solid #e0e4e7;
            padding: 20px;
        }
        .card-header .card-title {
            margin: 0;
            color: #212529;
            font-weight: 600;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div th:replace="~{part/modal :: modal}"></div>
        <div class="page-inner">
            <div class="page-header">
                <h4 class="page-title">Parts Inventory</h4>
                <ul class="breadcrumbs">
                    <li class="nav-home">
                        <i class="fas fa-box"></i>
                    </li>
                    <li class="separator">
                        <i class="flaticon-right-arrow"></i>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/parts}">Parts List</a>
                    </li>
                    <li class="separator">
                        <i class="flaticon-right-arrow"></i>
                    </li>
                    <li class="nav-item">
                        <a th:text="${part.code}"></a>
                    </li>
                </ul>
                <div class="header-action-group d-flex align-items-center ml-auto">
                    <a th:href="@{/parts}" class="btn btn-secondary ml-auto mt-2">
                        <i class="fa fa-list mr-1"></i> Back to Parts
                    </a>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-head-row">
                                <div class="card-title" th:text="${part.code} + ' - ' + ${part.name}"></div>
                            </div>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/parts/update}" th:object="${partDTO}" method="post" enctype="multipart/form-data">
                                <input type="hidden" name="id" th:value="${part.id}" />
                                
                                <!-- Basic Information Section -->
                                <div class="part-info-section">
                                    <h6><i class="fas fa-info-circle mr-2"></i>Basic Information</h6>
                                    <div class="info-row">
                                        <div class="form-group">
                                            <label for="code">Code <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="code" name="code" th:value="${part.code}" required />
                                        </div>
                                        <div class="form-group">
                                            <label for="name">Name <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="name" name="name" th:value="${part.name}" required />
                                        </div>
                                    </div>
                                    <div class="info-row">
                                        <div class="form-group">
                                            <label for="model">Model</label>
                                            <input type="text" class="form-control" id="model" name="model" th:value="${part.model}" />
                                        </div>
                                        <div class="form-group">
                                            <label for="manufacturer">Manufacturer</label>
                                            <input type="text" class="form-control" id="manufacturer" name="manufacturer" th:value="${part.manufacturer}" />
                                        </div>
                                    </div>
                                </div>

                                <!-- Organization Details Section -->
                                <div class="part-info-section">
                                    <h6><i class="fas fa-sitemap mr-2"></i>Organization Details</h6>
                                    <div class="info-row">
                                        <!-- Category with Livesearch -->
                                        <div class="form-group">
                                            <label for="categoryInput">Category</label>
                                            <div class="position-relative">
                                                <input type="text" class="form-control" id="categoryInput" 
                                                       placeholder="Search category..." autocomplete="off" 
                                                       th:value="${part.categoryName}" />
                                                <div id="categoryDropdown" class="dropdown-menu"
                                                    style="position: absolute; z-index: 1000; display: none; max-height: 200px; overflow-y: auto; border: 1px solid #dee2e6; border-top: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%;">
                                                </div>
                                                <select class="d-none" name="categoryName" id="categorySelect">
                                                    <option th:each="cat : ${categories}" 
                                                            th:value="${cat.name}" 
                                                            th:text="${cat.code + ' - ' + cat.name}"
                                                            th:selected="${part.categoryName == cat.name}">
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <!-- Supplier with Livesearch -->
                                        <div class="form-group">
                                            <label for="supplierInput">Supplier</label>
                                            <div class="position-relative">
                                                <input type="text" class="form-control" id="supplierInput" 
                                                       placeholder="Search supplier..." autocomplete="off" 
                                                       th:value="${part.supplierName}" />
                                                <div id="supplierDropdown" class="dropdown-menu"
                                                    style="position: absolute; z-index: 1000; display: none; max-height: 200px; overflow-y: auto; border: 1px solid #dee2e6; border-top: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%;">
                                                </div>
                                                <select class="d-none" name="supplierName" id="supplierSelect">
                                                    <option th:each="sup : ${suppliers}" 
                                                            th:value="${sup.name}" 
                                                            th:text="${sup.code + ' - ' + sup.name}"
                                                            th:selected="${part.supplierName == sup.name}">
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="info-row">
                                        <!-- Section with Livesearch -->
                                        <div class="form-group">
                                            <label for="sectionInput">Section</label>
                                            <div class="position-relative">
                                                <input type="text" class="form-control" id="sectionInput" 
                                                       placeholder="Search section..." autocomplete="off" 
                                                       th:value="${part.sectionCode}" />
                                                <div id="sectionDropdown" class="dropdown-menu"
                                                    style="position: absolute; z-index: 1000; display: none; max-height: 200px; overflow-y: auto; border: 1px solid #dee2e6; border-top: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%;">
                                                </div>
                                                <select class="d-none" name="sectionCode" id="sectionSelect">
                                                    <option th:each="sec : ${sections}" 
                                                            th:value="${sec.code}" 
                                                            th:text="${sec.code}"
                                                            th:selected="${part.sectionCode == sec.code}">
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label for="specification">Specification</label>
                                            <input type="text" class="form-control" id="specification" name="specification" th:value="${part.specification}" />
                                        </div>
                                    </div>
                                </div>

                                <!-- Inventory & Stock Section -->
                                <div class="part-info-section">
                                    <h6><i class="fas fa-warehouse mr-2"></i>Inventory & Stock</h6>
                                    <div class="info-row">
                                        <div class="form-group">
                                            <label for="stockQuantity">Stock Quantity</label>
                                            <input type="number" class="form-control" id="stockQuantity" name="stockQuantity" th:value="${part.stockQuantity}" />
                                        </div>
                                        <div class="form-group">
                                            <label for="prQuantity">PR Quantity</label>
                                            <input type="number" class="form-control" id="prQuantity" name="prQuantity" th:value="${part.prQuantity}" readonly />
                                        </div>
                                    </div>
                                    <div class="info-row">
                                        <div class="form-group">
                                            <label for="safetyMinQty">Safety Quantity (Min)</label>
                                            <input type="number" class="form-control" id="safetyMinQty" name="safetyMinQty" th:value="${part.safetyMinQty}" min="0" />
                                        </div>
                                        <div class="form-group">
                                            <label for="equipmentCount">Equipment Count</label>
                                            <input type="number" class="form-control" id="equipmentCount" name="equipmentCount" th:value="${part.equipmentCount}" readonly />
                                        </div>
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="btn-action-group">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save mr-2"></i> Save Changes
                                    </button>
                                    <a th:href="@{/parts}" class="btn btn-outline-secondary">
                                        <i class="fas fa-times mr-2"></i> Cancel
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Part Image Section (Sidebar) -->
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-head-row">
                                <div class="card-title">Part Image</div>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="part-image-container">
                                <button type="button" id="previewImageLink" class="btn btn-link p-0" 
                                        onclick="event.preventDefault(); event.stopPropagation(); showImageModal(event);"
                                        style="border: none; background: none;">
                                    <img id="editImagePreview"
                                         th:src="${part.image != null} ? @{/upload/part/image/__${part.image}__} : @{/assets/img/no-image.png}"
                                         alt="Part Image"
                                         onclick="event.preventDefault(); event.stopPropagation(); showImageModal(event);">
                                </button>
                            </div>
                            
                            <div class="mt-3">
                                <div class="custom-file">
                                    <input type="file" class="custom-file-input" id="editImageInput" name="imageFile" accept="image/*">
                                    <label class="custom-file-label" for="editImageInput">Choose image...</label>
                                </div>
                                <small class="form-text text-muted mt-2">
                                    <i class="fas fa-info-circle mr-1"></i>Supported formats: JPG, PNG, GIF
                                </small>
                            </div>

                            <div class="custom-control custom-checkbox mt-3">
                                <input type="checkbox" class="custom-control-input" id="deleteImage" name="deleteImage" value="true">
                                <label class="custom-control-label" for="deleteImage">
                                    <small>Remove current image</small>
                                </label>
                            </div>

                            <hr class="my-4">

                            <form th:action="@{'/parts/' + ${part.id} + '/delete'}" method="post" onsubmit="return confirm('Are you sure you want to delete this part? This action cannot be undone.');">
                                <button type="submit" class="btn btn-danger btn-block">
                                    <i class="fa fa-trash mr-2"></i> Delete Part
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<th:block layout:fragment="scripts">
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // File input preview
            const fileInput = document.getElementById('editImageInput');
            const preview = document.getElementById('editImagePreview');
            const fileLabel = document.querySelector('label[for="editImageInput"]');
            
            if (fileInput) {
                fileInput.addEventListener('change', function (evt) {
                    const file = evt.target.files && evt.target.files[0];
                    
                    // Update the custom-file label text
                    if (fileLabel) {
                        fileLabel.textContent = file ? file.name : 'Choose image...';
                    }
                    
                    // Update preview if valid image
                    if (file && file.type && file.type.match('image.*')) {
                        const reader = new FileReader();
                        reader.onload = function () {
                            if (preview) {
                                preview.src = reader.result;
                                preview.style.display = 'block';
                            }
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
        });
    </script>

    <!-- Image Preview Modal -->
    <div class="modal fade" id="partImageModal" tabindex="-1" aria-labelledby="partImageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="partImageModalLabel">Part Image</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-3">
                    <img id="partModalImage" class="img-fluid" src="" alt="Part image" />
                </div>
            </div>
        </div>
    </div>

    <script>
        function showImageModal(event) {
            event.preventDefault();
            event.stopPropagation();
            
            const modal = document.getElementById('partImageModal');
            const modalImage = document.getElementById('partModalImage');
            const sourceImage = document.getElementById('editImagePreview');
            
            if (modal && modalImage && sourceImage) {
                modalImage.src = sourceImage.src;
                const bootstrapModal = new bootstrap.Modal(modal);
                bootstrapModal.show();
            }
        }

        // Livesearch functionality
        function setupLiveSearch(inputId, selectId, fieldLabel = 'item') {
            const input = document.getElementById(inputId);
            const select = document.getElementById(selectId);
            const dropdown = document.getElementById(`${inputId.replace('Input', 'Dropdown')}`);
            
            const options = Array.from(select.options)
                .filter(opt => opt.value)
                .map(opt => ({
                    value: opt.value,
                    label: opt.text,
                    id: opt.dataset.id || ''
                }));

            if (!input || !select || !dropdown) {
                console.warn(`Missing elements for ${inputId}`);
                return;
            }

            input.addEventListener('input', function () {
                const term = this.value.toLowerCase().trim();
                dropdown.innerHTML = '';
                
                if (term === '') {
                    dropdown.style.display = 'none';
                    select.value = '';
                    return;
                }
                
                const filtered = options.filter(opt =>
                    opt.label.toLowerCase().includes(term) || opt.value.toLowerCase().includes(term)
                );
                
                if (filtered.length === 0) {
                    dropdown.style.display = 'none';
                    return;
                }
                
                filtered.forEach(opt => {
                    const div = document.createElement('div');
                    div.className = 'dropdown-item';
                    div.style.cursor = 'pointer';
                    div.style.padding = '8px 12px';
                    div.style.whiteSpace = 'normal';
                    
                    const regex = new RegExp(`(${term})`, 'gi');
                    const highlighted = opt.label.replace(regex, '<strong>$1</strong>');
                    div.innerHTML = highlighted;
                    
                    div.addEventListener('click', () => {
                        input.value = opt.label;
                        select.value = opt.value;
                        dropdown.style.display = 'none';
                        input.focus();
                    });
                    
                    div.addEventListener('mouseenter', () => {
                        div.classList.add('active');
                        div.style.backgroundColor = '#e9ecef';
                    });
                    
                    div.addEventListener('mouseleave', () => {
                        div.classList.remove('active');
                        div.style.backgroundColor = 'transparent';
                    });
                    
                    dropdown.appendChild(div);
                });
                
                dropdown.style.display = 'block';
                dropdown.style.width = input.offsetWidth + 'px';
            });

            document.addEventListener('click', function (e) {
                if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });

            input.addEventListener('keydown', function (e) {
                const items = dropdown.querySelectorAll('.dropdown-item');
                if (items.length === 0) return;
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    let current = Array.from(items).findIndex(item => item.classList.contains('active'));
                    current = (current + 1) % items.length;
                    items.forEach(item => item.classList.remove('active'));
                    items[current].classList.add('active');
                    items[current].scrollIntoView({ block: 'nearest' });
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    let current = Array.from(items).findIndex(item => item.classList.contains('active'));
                    current = current <= 0 ? items.length - 1 : current - 1;
                    items.forEach(item => item.classList.remove('active'));
                    items[current].classList.add('active');
                    items[current].scrollIntoView({ block: 'nearest' });
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const active = dropdown.querySelector('.dropdown-item.active');
                    if (active) {
                        active.click();
                    }
                } else if (e.key === 'Escape') {
                    dropdown.style.display = 'none';
                }
            });
        }

        // Initialize livesearch on page load
        document.addEventListener('DOMContentLoaded', function () {
            setupLiveSearch('categoryInput', 'categorySelect', 'category');
            setupLiveSearch('supplierInput', 'supplierSelect', 'supplier');
            setupLiveSearch('sectionInput', 'sectionSelect', 'section');
        });
    </script>
</th:block>
